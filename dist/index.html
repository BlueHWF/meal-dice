<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fc642d">
  <meta name="description" content="把喜欢的饭放进六面骰子。自定义餐食，自动找图，投一下决定今天吃什么。">
  <title>吃饭骰子 · 今天吃什么</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23fc642d'/%3E%3Cg fill='white'%3E%3Ccircle cx='10' cy='10' r='3'/%3E%3Ccircle cx='22' cy='10' r='3'/%3E%3Ccircle cx='16' cy='16' r='3'/%3E%3Ccircle cx='10' cy='22' r='3'/%3E%3Ccircle cx='22' cy='22' r='3'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">⚄</span>吃饭骰子<span class="brand-en">MEAL DICE</span></a><span class="top-note">选择困难，交给六面。</span></header>
  <main>
    <section class="play-section" aria-labelledby="page-title">
      <div class="eyebrow"><span class="small-rule"></span> 一顿饭的小决定</div>
      <h1 id="page-title">今天，<br>吃点<span>什么？</span></h1>
      <p class="intro">放进你喜欢的，剩下的交给骰子。</p>
      <div class="dice-stage" aria-label="六面餐食骰子">
        <span class="stage-note">LET'S ROLL</span>
        <div class="scene"><div class="cube" id="cube"></div></div>
        <div class="dice-shadow"></div>
        <span class="stage-plus plus-one" aria-hidden="true">＋</span><span class="stage-plus plus-two" aria-hidden="true">＋</span>
      </div>
      <div class="result" id="result" aria-live="polite"><span class="result-label">六个选择，一个好胃口</span><strong id="result-name">让骰子替你做决定</strong></div>
      <button class="roll-button" id="roll-button"><span aria-hidden="true">⚄</span><span id="roll-label">投一下，开饭！</span><span class="button-arrow" aria-hidden="true">↗</span></button>
      <p class="keyboard-tip">也可以按 <kbd>空格</kbd> 投掷 <span>·</span> 每一面，机会均等</p>
    </section>
    <section class="options-section" aria-labelledby="options-title">
      <div class="section-heading"><div><div class="eyebrow">YOUR SIX SIDES</div><h2 id="options-title">我的六面菜单<span>06</span></h2></div><button class="icon-button" id="reset-button" aria-label="恢复默认六面菜单" title="恢复默认菜单">↺</button></div>
      <div class="edit-tip"><span aria-hidden="true">✦</span><p>改个名字，就能自动找张配图。</p></div>
      <div class="meal-list" id="meal-list"></div>
      <button class="search-all" id="search-all"><span aria-hidden="true">✦</span> 为六面重新找图</button>
      <p class="save-note" id="save-note">修改会保存在当前浏览器</p>
    </section>
  </main>
  <footer><span>不纠结，好好吃饭。</span><span>六面都是好选择 <span class="footer-spark" aria-hidden="true">✳</span></span></footer>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="image-dialog" aria-labelledby="image-title"><div class="dialog-heading"><h2 id="image-title">换一张喜欢的</h2><button class="icon-button" id="close-dialog" aria-label="关闭">×</button></div><p id="image-description"></p><div class="dialog-actions"><button class="search-all" id="dialog-search">✦ 自动搜索配图</button><button class="upload-button" id="upload-button" type="button">上传自己的图片</button><input type="file" id="image-upload" accept="image/png,image/jpeg,image/webp,image/gif" hidden></div><div id="image-candidates" class="image-candidates"></div><p class="image-credit" id="image-credit"></p></dialog>
</body>
</html>
